name: Build TrollStore IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid libarchive openssl@3 pkg-config
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Theos & iOS 16.5 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build TrollStore IPA
        run: |
          make trollstore_ipa

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: |
            _build/TrollStore.ipa
            _build/TrollStore.tar
